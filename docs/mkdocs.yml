# ── Site metadata ────────────────────────────────────────
site_name: iobox
site_url: https://timainge.github.io/iobox/
site_description: Personal workspace context tool — email, calendar, and files across Gmail and Microsoft 365
repo_url: https://github.com/timainge/iobox
repo_name: timainge/iobox

docs_dir: content
site_dir: site

# ── Theme ────────────────────────────────────────────────
theme:
  name: shadcn
  custom_dir: overrides
  topbar_sections: true
  icon: assets/logo.svg
  logo: assets/logo.svg
  favicon: assets/logo.svg

# ── Plugins ──────────────────────────────────────────────
plugins:
  - search

# ── Markdown extensions ──────────────────────────────────
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

# ── Extra assets ─────────────────────────────────────────
extra_css:
  - css/custom.css

extra_javascript:
  - js/theme-toggle.js
  - js/mermaid-init.js

# ── Navigation ───────────────────────────────────────────
# Top-level sections render as topbar tabs; their children fill the sidebar.
nav:
  - iobox: index.md
  - Get Started:
    - What is iobox?: get-started/index.md
    - Concepts: get-started/concepts.md
    - Installation: get-started/installation.md
    - Connect Google: get-started/connect-google.md
    - Connect Microsoft 365: get-started/connect-microsoft.md
    - Quick Start: get-started/quickstart.md
  - MCP Server:
    - Overview: mcp/index.md
    - Configuration: mcp/configuration.md
    - Multi-account: mcp/multi-account.md
    - Tool Reference: mcp/tools.md
    - Troubleshooting: mcp/troubleshooting.md
    - Local Development: mcp/local-development.md
  - CLI:
    - Overview: cli/index.md
    - Workspaces:
      - space: cli/space.md
    - Email:
      - search: cli/search.md
      - save: cli/save.md
      - send: cli/send.md
      - forward: cli/forward.md
      - Drafts: cli/drafts.md
      - label: cli/label.md
      - trash: cli/trash.md
      - auth-status: cli/auth-status.md
    - Calendar:
      - events: cli/events.md
    - Files:
      - files: cli/files.md
  - SDK:
    - Overview: sdk/index.md
    - Workspace: sdk/workspace.md
    - Providers: sdk/providers.md
    - Types: sdk/types.md
    - Processing: sdk/processing.md
  - Reference:
    - Configuration: reference/configuration.md
    - Output Format: reference/output-format.md
    - Provider Behaviour: reference/providers.md
